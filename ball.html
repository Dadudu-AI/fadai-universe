<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:transparent;-webkit-user-select:none;user-select:none;width:100%;height:100%;}
  /* 球体皮肤容器：窗口 320x360，球放在右下角但留出呼吸光晕空间（不被窗口边缘裁切） */
  #ball{
    width:56px;height:56px;border-radius:50%;cursor:pointer;
    position:fixed;right:44px;bottom:44px;z-index:10;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 32% 28%, rgba(90,150,255,.55), rgba(30,50,130,.85) 62%, rgba(10,18,60,.95));
    box-shadow:0 0 22px rgba(80,130,255,.55), inset 0 0 12px rgba(160,200,255,.35);
    transition:transform .18s ease, box-shadow .18s ease;
    animation:breathe 2.6s ease-in-out infinite;
  }
  #ball:hover{transform:scale(1.12);box-shadow:0 0 34px rgba(110,170,255,.8), inset 0 0 14px rgba(190,220,255,.5);}
  #ball:active{transform:scale(.94);}
  #ball svg{width:30px;height:30px;fill:#dcebff;filter:drop-shadow(0 0 8px rgba(120,180,255,.9));pointer-events:none;}
  @keyframes breathe{0%,100%{box-shadow:0 0 18px rgba(80,130,255,.45), inset 0 0 10px rgba(160,200,255,.3);}50%{box-shadow:0 0 34px rgba(100,160,255,.75), inset 0 0 16px rgba(190,220,255,.5);}}

  /* 皮肤：鲸鱼（圆形 + 尾鳍） */
  #ball.skin-whale{border-radius:50% 50% 50% 50%;background:radial-gradient(circle at 32% 28%, rgba(90,180,255,.6), rgba(20,60,140,.9) 62%, rgba(8,20,70,.98));}
  #ball.skin-whale svg.ico-ball{display:none;}
  #ball.skin-whale svg.ico-whale{display:block;}

  /* 皮肤：水母（半圆伞 + 触手） */
  #ball.skin-jelly{border-radius:50% 50% 50% 50%;background:radial-gradient(circle at 50% 30%, rgba(220,140,255,.55), rgba(120,40,180,.85) 60%, rgba(50,10,90,.98));}
  #ball.skin-jelly svg.ico-ball{display:none;}
  #ball.skin-jelly svg.ico-jelly{display:block;}

  /* 默认球体皮肤只显示音符 */
  #ball svg.ico-whale,#ball svg.ico-jelly{display:none;}

  #tip{
    position:fixed;right:108px;bottom:52px;white-space:nowrap;
    font:12px/1 -apple-system,"PingFang SC",sans-serif;color:#cfe0ff;
    background:rgba(12,20,50,.82);border:1px solid rgba(100,150,255,.4);
    border-radius:14px;padding:8px 12px;letter-spacing:2px;
    opacity:0;transform:translateX(6px);transition:.25s;pointer-events:none;
    backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(0,0,0,.45);
  }
  /* tip 样式跟随皮肤：球体=蓝、鲸鱼=深蓝、水母=紫 */
  #ball:hover + #tip{opacity:1;transform:translateX(0);}
  #ball.skin-whale + #tip{color:#b8dcff;background:rgba(10,26,64,.88);border-color:rgba(90,180,255,.45);box-shadow:0 4px 18px rgba(20,80,180,.5);}
  #ball.skin-jelly + #tip{color:#f0d6ff;background:rgba(40,14,70,.9);border-color:rgba(200,130,255,.5);box-shadow:0 4px 18px rgba(150,50,220,.5);}

  /* 右键菜单：窗口放大后有足够空间 */
  #menu{
    position:fixed;display:none;min-width:150px;z-index:99;
    background:rgba(14,22,52,.95);border:1px solid rgba(100,150,255,.35);
    border-radius:10px;padding:5px;backdrop-filter:blur(10px);
    box-shadow:0 8px 30px rgba(0,0,0,.55);font:13px/1 -apple-system,"PingFang SC",sans-serif;
  }
  #menu.show{display:block;}
  #menu .mi{padding:9px 14px;color:#cdd9f2;cursor:pointer;border-radius:6px;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between;gap:14px;}
  #menu .mi:hover{background:rgba(70,110,220,.35);}
  #menu .mi .k{font-size:10px;color:#6b7fb0;}
  #menu .sep{height:1px;background:rgba(100,150,255,.18);margin:4px 6px;}
  #menu .mi.danger{color:#ff9a9a;}
  #menu .mi.danger:hover{background:rgba(200,70,70,.28);}
  #menu .mi.cur{color:#8fd0ff;}
  #menu .mi.cur::after{content:'✓';color:#7cc4ff;margin-left:8px;}
  #menu .sub{font-size:10px;color:#6b7fb0;padding:6px 14px 3px;letter-spacing:2px;}
</style>
</head>
<body>
<div id="ball" class="skin-orb">
  <svg class="ico-ball" viewBox="0 0 24 24"><path d="M9 18.5a3 3 0 1 1-2-2.83V5l10-2v11.67a3 3 0 1 1-2-2.83V7.1L9 8.6v9.9z"/></svg>
  <svg class="ico-whale" viewBox="0 0 24 24"><path d="M2 13c1.5-3.5 5-6 9.5-6 3.5 0 6.5 1.5 8.5 4l2-1-.5 3c1 1 1.5 2.5 1.5 4 0 1-.5 1.5-1.5 1.5-1.7 0-3.3-1-4.5-2.5h-2.5c-.5 1.5-2 2.5-3.5 2.5S7.5 17.5 7 16c-2 0-3.5-.8-4.5-2-.4.6-1 1-1.5 1 .2-1 .8-1.8 1-2zM8 11.5c-1 0-2 .3-2.8.9C6.4 13 7.4 13.5 8.5 13.5c1.6 0 3-.5 4-1.3-.9-.5-2.3-.7-4.5-.7z"/></svg>
  <svg class="ico-jelly" viewBox="0 0 24 24"><path d="M4 11c0-4.4 3.6-8 8-8s8 3.6 8 8c0 1.5-.4 2.9-1 4H5c-.6-1.1-1-2.5-1-4zm3 5h10l-1 4.5c-.2.9-1 1.5-1.9 1.5h-4.2c-.9 0-1.7-.6-1.9-1.5L7 16zm3 1.5v2c0 .6.4 1 1 1s1-.4 1-1v-2h-2zm3 0v2.5c0 .6.4 1 1 1s1-.4 1-1v-2.5h-2z"/></svg>
</div>
<div id="tip">发呆音宇宙</div>
<div id="menu">
  <div class="mi" data-action="open">打开可视化<span class="k">左键</span></div>
  <div class="mi" data-action="bind">绑定播放器…<span class="k">⚙</span></div>
  <div class="sep"></div>
  <div class="sub">悬浮球皮肤</div>
  <div class="mi cur" data-skin="orb">球体</div>
  <div class="mi" data-skin="whale">鲸鱼</div>
  <div class="mi" data-skin="jelly">水母</div>
  <div class="sep"></div>
  <div class="mi danger" data-action="quit">退出<span class="k">⌘Q</span></div>
</div>
<script>
  const ball = document.getElementById('ball');
  const menu = document.getElementById('menu');
  let dragging = false;
  let moved = false;
  let startX = 0, startY = 0;
  let lastX = 0, lastY = 0;
  let currentSkin = 'orb';

  function applySkin(skin) {
    currentSkin = skin;
    ball.className = 'skin-' + skin;
    document.querySelectorAll('#menu .mi[data-skin]').forEach(el => {
      el.classList.toggle('cur', el.dataset.skin === skin);
    });
  }

  function closeMenu() {
    menu.classList.remove('show');
    // 菜单关闭后重新评估交互区（鼠标若已离开球则恢复穿透）
    if (window.electronAPI && window.electronAPI.ballInteractive) {
      window.electronAPI.ballInteractive(inInteractiveZone(lastKnownX, lastKnownY));
    }
  }

  let lastKnownX = 0, lastKnownY = 0;

  // ── 拖拽（左键按住移动窗口；不拖动松开 = 打开可视化）──
  ball.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return; // 只响应左键
    dragging = true;
    moved = false;
    startX = e.screenX;
    startY = e.screenY;
    lastX = e.screenX;
    lastY = e.screenY;
    try { ball.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.screenX - lastX;
    const dy = e.screenY - lastY;
    if (Math.abs(e.screenX - startX) > 3 || Math.abs(e.screenY - startY) > 3) moved = true;
    lastX = e.screenX;
    lastY = e.screenY;
    if (dx !== 0 || dy !== 0 && window.soundOrbAPI && window.soundOrbAPI.moveBall) {
      window.soundOrbAPI.moveBall(dx, dy);
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (!dragging) return;
    dragging = false;
    if (!moved && e.button === 0 && window.soundOrbAPI && window.soundOrbAPI.openVisualizer) {
      window.soundOrbAPI.openVisualizer();
    }
    moved = false;
  });

  // 窗口失焦时重置拖拽状态
  window.addEventListener('blur', () => { dragging = false; moved = false; closeMenu(); });

  // ── 右键菜单 ──
  menu.addEventListener('click', (e) => {
    const mi = e.target.closest('.mi');
    if (!mi) return;
    const action = mi.dataset.action;
    const skin = mi.dataset.skin;
    const mode = mi.dataset.mode;
    if (action === 'open') {
      if (window.soundOrbAPI) window.soundOrbAPI.openVisualizer();
    } else if (action === 'bind') {
      if (window.soundOrbAPI) window.soundOrbAPI.openBindDialog();
    } else if (action === 'quit') {
      if (window.electronAPI) window.electronAPI.quitApp();
    } else if (action === 'viz' && mode) {
      if (window.electronAPI) window.electronAPI.setVizMode(parseInt(mode, 10));
    } else if (skin) {
      applySkin(skin);
      if (window.electronAPI) window.electronAPI.setBallSkin(skin);
    }
    closeMenu();
  });

  // 点击菜单外关闭
  window.addEventListener('click', (e) => {
    if (!menu.contains(e.target) && e.target !== ball) closeMenu();
  });

  // 主进程启动时下发记忆的皮肤
  if (window.electronAPI && window.electronAPI.onBallSkin) {
    window.electronAPI.onBallSkin(function(skin){ applySkin(skin); });
  }

  // ── 鼠标穿透控制：鼠标在球/菜单上时窗口交互，否则穿透到下层应用 ──
  function inInteractiveZone(x, y) {
    const br = ball.getBoundingClientRect();
    const pad = 8; // 球周围一点缓冲，避免边缘误穿透
    if (x >= br.left - pad && x <= br.right + pad && y >= br.top - pad && y <= br.bottom + pad) return true;
    if (menu.classList.contains('show')) {
      const mr = menu.getBoundingClientRect();
      if (x >= mr.left && x <= mr.right && y >= mr.top && y <= mr.bottom) return true;
    }
    return false;
  }

  let interactive = false;
  function updateInteractive(x, y) {
    const want = inInteractiveZone(x, y);
    if (want !== interactive) {
      interactive = want;
      if (window.electronAPI && window.electronAPI.ballInteractive) {
        window.electronAPI.ballInteractive(want);
      }
    }
  }

  // forward 模式下即使穿透也能收到 mousemove
  window.addEventListener('mousemove', (e) => {
    lastKnownX = e.clientX;
    lastKnownY = e.clientY;
    updateInteractive(e.clientX, e.clientY);
  });

  // 菜单打开时确保交互
  ball.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    menu.classList.add('show');
    if (window.electronAPI && window.electronAPI.ballInteractive) {
      window.electronAPI.ballInteractive(true);
    }
    const bw = menu.offsetWidth, bh = menu.offsetHeight;
    let x = e.clientX, y = e.clientY;
    if (x + bw > window.innerWidth - 4) x = window.innerWidth - bw - 4;
    if (y + bh > window.innerHeight - 4) y = window.innerHeight - bh - 4;
    if (x < 4) x = 4;
    if (y < 4) y = 4;
    menu.style.left = x + 'px';
    menu.style.top = y + 'px';
  });
</script>
</body>
</html>
